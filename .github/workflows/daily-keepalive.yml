name: Daily keepalive + summary

# 每天 01:30 UTC 运行一次（美西时间前一日 17:30 PST / 18:30 PDT）。
# 免费档工具保活：公开仓标准 runner 不限分钟，不产生费用。
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Ping Supabase (keepalive)
        id: supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "::warning::SUPABASE_URL secret is not set — skipping Supabase keepalive. Set it in Settings -> Secrets and variables -> Actions."
            echo "status=not_configured" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$SUPABASE_URL" || echo "000")
          if [ "$code" = "000" ]; then
            echo "::warning::Supabase URL unreachable (no HTTP response)."
            echo "status=unreachable" >> "$GITHUB_OUTPUT"
          else
            echo "Supabase responded with HTTP $code."
            echo "status=ok ($code)" >> "$GITHUB_OUTPUT"
          fi

      - name: Write daily summary log
        env:
          SUPABASE_STATUS: ${{ steps.supabase.outputs.status }}
        run: |
          today=$(date -u +%F)
          mkdir -p logs
          cat > "logs/$today.md" <<EOF
          # 每日汇总 $today (UTC)

          | 工具 | 保活状态 |
          | --- | --- |
          | Supabase | $SUPABASE_STATUS |

          _后续工具待接入：OpenRouter、Cloudflare Workers 等。_
          EOF
          cat "logs/$today.md"

      - name: Commit summary log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add logs/
          git diff --cached --quiet && echo "No changes to commit." || git commit -m "Daily keepalive summary $(date -u +%F)"
          git push
